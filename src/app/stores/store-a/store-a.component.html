<h1>Page store A</h1>
<p>Client-side filtering</p>
<div>
  @if(filtersForm) {
  <form [formGroup]="filtersForm" (ngSubmit)="applyFilters()">
    <div class="container">
      <div *ngFor="let filter of filters" class="field">
        <label>{{ filter.label }}</label>
        <ng-container [ngSwitch]="filter.type">
          <mat-form-field *ngSwitchCase="'select'">
            <mat-select formControlName="{{ filter.name }}">
              <mat-option *ngFor="let option of filter.options" [value]="option.value">{{
                option.name
              }}</mat-option>
            </mat-select>
          </mat-form-field>
          <mat-checkbox *ngSwitchCase="'checkbox'" formControlName="{{ filter.name }}">{{
            filter.label
          }}</mat-checkbox>
          <mat-form-field *ngSwitchCase="'text'">
            <input matInput formControlName="{{ filter.name }}" />
          </mat-form-field>
        </ng-container>
      </div>
    </div>
    <div class="container">
      <button mat-raised-button type="submit">Apply</button>
      <button mat-button type="button" (click)="resetFilters()">Reset</button>
    </div>
  </form>
  }
</div>

<div>
  @if(filteredData) {
  <table mat-table [dataSource]="filteredData">
    @for(cell of displayedColumns; track cell) {
    <ng-container [matColumnDef]="cell">
      <th mat-header-cell *matHeaderCellDef>{{ cell | titlecase }}</th>
      <td mat-cell *matCellDef="let element">{{ element[cell] }}</td>
    </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  }
</div>
