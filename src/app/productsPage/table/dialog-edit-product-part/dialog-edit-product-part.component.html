<h2 mat-dialog-title>Edit product</h2>
<mat-dialog-content>
  <mat-tab-group class="content">
    <mat-tab label="Product">
      <div class="content-box">
        <mat-form-field class="field">
          <mat-label>Product name</mat-label>
          <input matInput [(ngModel)]="data.name" />
        </mat-form-field>
        <mat-form-field class="field">
          <mat-label>Price</mat-label>
          <input matInput [(ngModel)]="data.price" type="number" />
        </mat-form-field>
        <mat-form-field class="field">
          <mat-label>Discount, %</mat-label>
          <input matInput [(ngModel)]="data.discount" type="number" />
        </mat-form-field>
      </div>
    </mat-tab>
    <mat-tab label="Categoty">
      <div class="content-box">
        <categoties-tree [categories]="data.categories"></categoties-tree>
      </div>
    </mat-tab>
  </mat-tab-group>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Cancel</button>
  <button mat-button (click)="save()">Save</button>
</mat-dialog-actions>
